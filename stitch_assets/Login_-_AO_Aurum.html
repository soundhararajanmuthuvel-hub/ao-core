<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface p-6">
<!-- Login Container -->
<main class="w-full max-w-md">
<!-- Logo Section -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center mb-6">
<img alt="AO Core" class="w-16 h-16 object-contain opacity-90 brightness-110" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmaEd4NVcjzITaDOze4X0RWoI93hKwMjmoohtPYqw-k3JigmZfIOH9ZLdlW3qCqIHz5ICAit_UfFf5QHMK37466Qmz_CKjJfXzudye2XbnMCdLy-2w-4F5LH_roaFOk4HPLKLjLp45WNUdwVGKmqcUMhcyHCxY6hn3inxHJFZy9Y0-K4eRE2vx1Yw_1y2_S2yiNzFV07XWNVE2hDuk-S8hvgLQRvgWEaWKc19El_Ag6pEEvGcN6iMIY2at-mjdeWj8ucTpED5hJZ4"/>

<p class="font-label-md text-xs text-outline tracking-[0.2em] uppercase">Enterprise Management for Organic Excellence</p>
</div>
<!-- Login Card -->
<div class="login-card rounded-xl p-8 mb-8">
<div class="mb-8">
<h2 class="font-headline-md text-2xl text-on-surface mb-1">Welcome Back</h2>
<p class="font-body-md text-sm text-on-surface-variant">Sign in to access your dashboard</p>
</div>
<form class="space-y-6" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-xs text-outline block uppercase tracking-wider" for="email">Business Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-lg">mail</span>
<input class="w-full pl-10 pr-4 py-3 glass-input rounded-lg text-on-surface placeholder:text-outline-variant font-body-md outline-none transition-all focus:ring-0" id="email" name="email" placeholder="name@aocore.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-xs text-outline block uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-xs text-secondary hover:text-secondary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-lg">lock</span>
<input class="w-full pl-10 pr-10 py-3 glass-input rounded-lg text-on-surface placeholder:text-outline-variant font-body-md outline-none transition-all focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-3">
<div class="relative flex items-center">
<input class="w-4 h-4 rounded-sm border-outline-variant bg-surface-container-lowest text-secondary focus:ring-secondary focus:ring-offset-surface-dim" id="remember" type="checkbox"/>
</div>
<label class="font-body-md text-sm text-on-surface-variant" for="remember">Keep me logged in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary-container text-secondary font-semibold py-4 rounded-lg hover:bg-secondary hover:text-secondary-container active:scale-[0.99] transition-all flex items-center justify-center gap-3 border border-secondary/20 shadow-lg" type="submit">
<span class="material-symbols-outlined text-xl">login</span>
<span class="uppercase tracking-widest text-sm font-bold">Secure Login</span>
</button>
</form>
<!-- SSO / Alternative Options -->
<div class="mt-10">
<div class="relative flex items-center mb-6">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-label-md text-[10px] text-outline uppercase tracking-[0.2em]">Or continue with</span>

<span class="font-label-md text-xs text-on-surface-variant">Google</span>

<img class="w-4 h-4 opacity-70 group-hover:opacity-100 transition-opacity" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBohcl31EPKQe4xOUefh4HpTRxvu3TALWUELCEVX22dxddQ-SBaFkcV5NPS8dL1w52oovmvtRTh2H787U6Bwm5C0s3nwU2_jEBjkSZOUZJrs0j6lrVZvKL0GfbFkel-dLmUVU3jku3uWwMA_dmy3ewC_2pk_pXRbd99nWUx2ZtU_ftq5H_jHx8mMH0q-ZYTaS1Te7lXI0dxXsNkwHmZ7pik-Usi-ZG_TrZNBLi7l05q3_pg0OooyrFcX4v56sfuBC0JqOJ7izwHNWw"/>

<!-- Success/Processing Overlay -->
<div class="fixed inset-0 bg-surface-dim/80 backdrop-blur-md hidden items-center justify-center z-50" id="loadingOverlay">
<div class="bg-surface-container p-12 rounded-xl shadow-2xl flex flex-col items-center border border-secondary/20">
<div class="w-12 h-12 border-2 border-secondary/20 border-t-secondary rounded-full animate-spin"></div>
<p class="mt-8 font-headline-md text-xl text-secondary uppercase tracking-[0.2em]">Authenticating</p>
</div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            overlay.innerHTML = `
                <div class="bg-surface-container p-12 rounded-xl shadow-2xl flex flex-col items-center border border-secondary/20">
                    <span class="material-symbols-outlined text-5xl text-secondary mb-6" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    <p class="font-headline-md text-xl text-secondary mb-2 uppercase tracking-widest">Access Granted</p>
                    <p class="font-body-md text-sm text-on-surface-variant">Entering the AO Core Dashboard...</p>
                </div>
            `;
            
            setTimeout(() => {
                alert('Authentication successful. Redirecting...');
                overlay.style.display = 'none';
            }, 1000);
        }
    </script>
</body></html>
