<style>

<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Login Container -->
<main class="w-full max-w-md px-md">
<!-- Logo Section -->
<div class="mb-xl text-center">
<div class="inline-flex items-center justify-center p-md rounded-xl mb-md">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAksnwV4lXejryckRInRGW1-PV2DgokAKxDuR6K1kZTFZjEJbO0wUnSSjkRROl8pNrZOk0bCQiz2D8D90HQ22AS15c7T8-rYk96Tt_4lSzC8tCCWtzImvF6X18VzNJ_mmSwnhjZDPxkSI5PqIv9m2SwDTEYtHf2lAV8sw0LrejOJEgxKJnVJUPkE5p2M-chotQHbk-5TM3S2jvgiT-lqtC8Oi-cr5zlF1t-4qK6dIAyKbCKCEX9NKKYQbzEnx1joC-HGywJXVcN7KI" alt="Amudhasurabiy Organics Logo" class="w-12 h-12 object-contain">
</div>
<h1 class="font-headline-md text-headline-md text-primary">AO Core ERP</h1>
<p class="font-body-sm text-body-sm text-outline mt-xs">Enterprise Management for Organic Excellence</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant rounded-xl p-xl">
<div class="mb-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Welcome Back</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to access your dashboard</p>
</div>
<form class="space-y-lg" id="loginForm" onsubmit="handleLogin(event)">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase" for="email">Business Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-md py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md transition-all outline-none" id="email" name="email" placeholder="name@aocore.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block uppercase" for="password">Password</label>
<a class="font-label-md text-label-md text-on-primary-fixed-variant hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-sm bg-surface rounded-lg border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container font-body-md text-body-md transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-sm">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container" id="remember" type="checkbox">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Keep me logged in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-body-lg text-body-lg font-semibold py-md rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span class="material-symbols-outlined text-lg" data-icon="login">login</span>
                    Secure Login
                </button>
</form>
<!-- SSO / Alternative Options -->
<div class="mt-xl">
<div class="relative flex items-center mb-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-md font-label-md text-label-md text-outline uppercase">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5" data-alt="A clean, flat vector icon of the Google logo in a minimalist business style with a soft light-mode aesthetic, centered on a white background." src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5" data-alt="A high-quality Microsoft Azure logo icon in a minimalist professional style, featuring soft gradients of blue, isolated on a white background." src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg">
<span class="font-label-md text-label-md">Azure AD</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<footer class="mt-xl text-center space-y-sm">
<div class="flex items-center justify-center gap-md">
<a class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors uppercase" href="#">Privacy Policy</a>
<span class="text-outline-variant">•</span>
<a class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors uppercase" href="#">Terms of Service</a>
<span class="text-outline-variant">•</span>
<a class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors uppercase" href="#">Help Center</a>
</div>
<p class="font-body-sm text-body-sm text-outline-variant">© 2024 AO Core Enterprise Resources. All rights reserved.</p>
</footer>
</main>
<!-- Success/Processing Overlay -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm hidden items-center justify-center z-50" id="loadingOverlay">
<div class="bg-surface p-xl rounded-xl shadow-2xl flex flex-col items-center">
<div class="w-12 h-12 border-4 border-primary-fixed border-t-primary-container rounded-full animate-spin"></div>
<p class="mt-lg font-headline-sm text-headline-sm text-primary">Authenticating...</p>
</div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            
            // Artificial delay to simulate secure authentication
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // For demo purposes, we just hide it and show success alert
            overlay.innerHTML = `
                <div class="bg-surface p-xl rounded-xl shadow-2xl flex flex-col items-center">
                    <span class="material-symbols-outlined text-6xl text-green-600 mb-md" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    <p class="font-headline-sm text-headline-sm text-primary">Access Granted</p>
                    <p class="font-body-sm text-body-sm text-outline">Redirecting to AO Core Dashboard...</p>
                </div>
            `;
            
            setTimeout(() => {
                // In a real app, window.location.href = '/dashboard';
                alert('Authentication successful. Handing over to Dashboard...');
                overlay.style.display = 'none';
            }, 1000);
        }
    </script>


</body></html>
